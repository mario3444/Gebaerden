<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gebärden live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#12262B;--mut:#5A6E73;--acc:#0B6E78;--onacc:#fff;--hot:#B87400;--line:#CBD8D5;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D21;--card:#16292E;--ink:#E7F0EE;--mut:#93A9AD;--acc:#4CC3CE;--onacc:#0E1D21;--hot:#FFC83D;--line:#27424A}}
:root[data-theme="dark"]{--bg:#0E1D21;--card:#16292E;--ink:#E7F0EE;--mut:#93A9AD;--acc:#4CC3CE;--onacc:#0E1D21;--hot:#FFC83D;--line:#27424A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 14px}
.stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-height:56vh;width:100%;margin:0 auto}
video{width:100%;height:100%;object-fit:contain;display:block}
#now{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;padding:2px 12px;border-radius:99px;font-weight:700}
#now:empty{display:none}
button,.btn{font:700 20px inherit;font-family:inherit;border:0;border-radius:14px;padding:16px 20px;background:var(--acc);color:var(--onacc);width:100%;margin-top:14px;cursor:pointer;display:block;text-align:center}
button.on{background:var(--hot);color:#fff}
button.sec,.btn{background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:17px;padding:12px 16px}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
#tr{min-height:1.5em;color:var(--mut);margin:12px 2px 0}
#chips,#lib{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
#chips span,#lib span{padding:3px 12px;border-radius:99px;font-size:16px}
.ok{background:var(--acc);color:var(--onacc)}
.no{background:transparent;color:var(--mut);border:1px dashed var(--mut)}
#lib span{background:var(--card);border:1px solid var(--line)}
section{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:18px}
h2{font-size:19px;margin:0 0 4px}
p{margin:4px 0;color:var(--mut)}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<main>
<h1>Gebärden live</h1>
<div class="stage"><video id="v" muted playsinline></video><div id="now"></div></div>
<button id="mic">Zuhören starten</button>
<div id="tr" aria-live="polite"></div>
<div id="chips" aria-label="Erkannte Wörter"></div>

<section>
<h2>Meine Gebärden-Clips</h2>
<p>Dateiname = Wort, zum Beispiel <b>essen.mp4</b> oder <b>hilfe.mov</b>. Die Clips bleiben auf diesem Gerät gespeichert.</p>
<label class="btn" style="margin-top:12px">Videos aus Dateien auswählen<input id="f" type="file" accept="video/*" multiple></label>
<p id="cnt"></p>
<div id="lib"></div>
</section>

<section>
<h2>Ohne Mikrofon testen</h2>
<input id="t" type="text" placeholder="Satz eintippen, zum Beispiel: Ich möchte essen">
<button class="sec" id="tb">Satz abspielen</button>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const clips=new Map();
const key=n=>n.replace(/\.[^.]+$/,'').toLowerCase().replace(/[_\-]+/g,' ').trim();

/* Speicher auf dem Gerät (IndexedDB) */
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const DB=()=>new Promise((ok,no)=>{const r=indexedDB.open('gebaerden',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function save(k,b){try{(await DB()).transaction('f','readwrite').objectStore('f').put(b,k)}catch(e){}}
async function restore(){try{const s=(await DB()).transaction('f').objectStore('f');const ks=await rq(s.getAllKeys()),vs=await rq(s.getAll());ks.forEach((k,i)=>add(k,vs[i]))}catch(e){}render()}
function add(k,b){if(clips.has(k))URL.revokeObjectURL(clips.get(k));clips.set(k,URL.createObjectURL(b))}
function render(){
  const ks=[...clips.keys()].sort();
  $('#cnt').textContent=ks.length?ks.length+' Clips geladen':'Noch keine Clips geladen.';
  $('#lib').replaceChildren(...ks.map(k=>Object.assign(document.createElement('span'),{textContent:k})));
}
$('#f').onchange=e=>{for(const f of e.target.files){const k=key(f.name);add(k,f);save(k,f)}render();e.target.value=''};

/* Wort finden, auch in Grundform (gegessen → essen, trinkt → trinken) */
function find(w){
  w=w.toLowerCase().replace(/[^a-zäöüß]/g,'');if(!w)return null;
  const bases=[w];if(/^ge.{3,}/.test(w))bases.push(w.slice(2));
  for(const b of bases)for(const s of [b,b.replace(/(en|er|es|em|st|e|n|s|t)$/,'')]){
    if(s.length<2)continue;
    for(const c of [s,s+'en',s+'e',s+'n'])if(clips.has(c))return c;
  }
  return null;
}

/* Wiedergabe: Warteschlange, hält mit dem Sprechen Schritt */
const q=[];let playing=false;const v=$('#v');
function enqueue(k){q.push(k);while(q.length>3)q.shift();if(!playing)next()}
function next(){
  const k=q.shift();
  if(!k){playing=false;$('#now').textContent='';return}
  playing=true;$('#now').textContent=k;v.src=clips.get(k);v.play().catch(next);
}
v.onended=next;v.onerror=()=>{if(playing)next()};

function handle(words){
  for(const w of words){
    const k=find(w);
    const s=document.createElement('span');s.className=k?'ok':'no';s.textContent=w;
    $('#chips').prepend(s);while($('#chips').children.length>24)$('#chips').lastChild.remove();
    if(k)enqueue(k);
  }
}

/* Spracherkennung */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false,done={};
const mic=$('#mic');
function start(){
  if(!SR){$('#tr').textContent='Spracherkennung ist hier nicht verfügbar. Öffne die Seite in Safari.';return}
  rec=new SR();rec.lang='de-AT';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const ws=e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean),n=done[i]||0;
      if(ws.length>n){handle(ws.slice(n));done[i]=ws.length}
    }
    $('#tr').textContent=[...e.results].map(r=>r[0].transcript).join(' ').slice(-140);
  };
  rec.onend=()=>{done={};if(on){try{rec.start()}catch(e){}}};
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){stop();$('#tr').textContent='Mikrofon nicht erlaubt. Öffne die Seite direkt in Safari und erlaube den Zugriff.'}
  };
  on=true;mic.textContent='Zuhören stoppen';mic.classList.add('on');
  v.play().catch(()=>{});
  try{rec.start()}catch(e){}
}
function stop(){on=false;mic.textContent='Zuhören starten';mic.classList.remove('on');try{rec.stop()}catch(e){}}
mic.onclick=()=>on?stop():start();

$('#tb').onclick=()=>{const t=$('#t').value.trim();if(t)handle(t.split(/\s+/))};
$('#t').onkeydown=e=>{if(e.key==='Enter')$('#tb').click()};
restore();
</script>
</body>
</html>
